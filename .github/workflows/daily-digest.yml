name: Google News Stablecoin Daily Digest

on:
  workflow_dispatch:
  schedule:
    # 06:00 Asia/Seoul = 21:00 UTC (previous day)
    - cron: "0 21 * * *"

permissions:
  contents: read

concurrency:
  group: google-news-stablecoin-digest
  cancel-in-progress: false

jobs:
  send_digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stablecoin digest workflow
        env:
          TASK_NAME: google_news_stablecoin_daily_digest
          RSS_URL_KR: ${{ secrets.RSS_URL_KR }}
          RSS_URL_US: ${{ secrets.RSS_URL_US }}
          HOURS_BACK: "24"
          MAX_ITEMS: "100"
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Claude 큐레이션 — Pro/Max 구독 인증 (API 키 아님)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: sonnet
        run: python stablecoin_digest.py
